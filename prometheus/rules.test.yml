rule_files:
  - rules.yml
evaluation_interval: 5s
tests:
  - interval: 5s
    input_series:
      - series: 'ml_monitoring_available{job="adult-monitoring",instance="exporter:8000"}'
        values: '1+0x30'
      - series: 'ml_f1_score{job="adult-monitoring",instance="exporter:8000"}'
        values: '0.703191+0x5 0.644947+0x8 0.703191+0x17'
      - series: 'ml_f1_threshold{job="adult-monitoring",instance="exporter:8000"}'
        values: '0.663487+0x30'
      - series: 'ml_disparate_impact{job="adult-monitoring",instance="exporter:8000"}'
        values: '0.322102+0x30'
      - series: 'ml_disparate_impact_reference{job="adult-monitoring",instance="exporter:8000"}'
        values: '0.326482+0x30'
      - series: 'ml_fairness_valid{job="adult-monitoring",instance="exporter:8000"}'
        values: '1+0x30'
      - series: 'ml_fairness_di_min{job="adult-monitoring",instance="exporter:8000"}'
        values: '0.8+0x30'
      - series: 'ml_fairness_dpd_abs_max{job="adult-monitoring",instance="exporter:8000"}'
        values: '0.1+0x30'
      - series: 'ml_fairness_tpr_gap_abs_max{job="adult-monitoring",instance="exporter:8000"}'
        values: '0.1+0x30'
      - series: 'ml_dpd_abs{job="adult-monitoring",instance="exporter:8000"}'
        values: '0.1748+0x30'
      - series: 'ml_tpr_gap_abs{job="adult-monitoring",instance="exporter:8000"}'
        values: '0.065+0x30'
      - series: 'ml_feature_drift_detected{feature="age",job="adult-monitoring",instance="exporter:8000"}'
        values: '0+0x5 1+0x10 0+0x15'
      - series: 'ml_target_drift_detected{job="adult-monitoring",instance="exporter:8000"}'
        values: '0+0x30'
      - series: 'ml_female_target_drift_detected{job="adult-monitoring",instance="exporter:8000"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 15s
        alertname: ModelF1Low
        exp_alerts: []
      - eval_time: 50s
        alertname: ModelF1Low
        exp_alerts:
          - exp_labels:
              severity: warning
              job: adult-monitoring
              instance: exporter:8000
            exp_annotations:
              summary: Positive-class F1 is below its validation threshold
              description: Current scenario F1 is 0.644947.
      - eval_time: 95s
        alertname: ModelF1Low
        exp_alerts: []
      - eval_time: 40s
        alertname: FairnessThresholdViolated
        exp_alerts:
          - exp_labels:
              severity: warning
              job: adult-monitoring
              instance: exporter:8000
            exp_annotations:
              summary: One or more fairness thresholds are violated
              description: DI, absolute DPD, or absolute TPR gap crossed its configured report threshold.
      - eval_time: 40s
        alertname: FairnessDeteriorated
        exp_alerts: []
      - eval_time: 40s
        alertname: MonitoringUnavailable
        exp_alerts: []
      - eval_time: 50s
        alertname: FeatureDriftDetected
        exp_alerts:
          - exp_labels:
              severity: warning
              feature: age
              job: adult-monitoring
              instance: exporter:8000
            exp_annotations:
              summary: Feature drift detected for age
              description: Evidently per-feature score crossed the configured threshold.
      - eval_time: 40s
        alertname: FemaleTargetDriftDetected
        exp_alerts: []
  - interval: 5s
    input_series:
      - series: 'ml_monitoring_available{job="adult-monitoring",instance="exporter:8000"}'
        values: '0+0x30'
      - series: 'ml_f1_score{job="adult-monitoring",instance="exporter:8000"}'
        values: '0.60+0x30'
      - series: 'ml_f1_threshold{job="adult-monitoring",instance="exporter:8000"}'
        values: '0.66+0x30'
    alert_rule_test:
      - eval_time: 50s
        alertname: ModelF1Low
        exp_alerts: []
      - eval_time: 50s
        alertname: MonitoringUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              job: adult-monitoring
              instance: exporter:8000
            exp_annotations:
              summary: Monitoring report unavailable or stale
              description: Exporter has no fresh accepted Evidently result.

project:
  name: adult-income-monitoring
  random_seed: 42

paths:
  raw_data: data/raw
  interim_data: data/interim
  processed_data: data/processed
  model: models/catboost.cbm
  reports: reports

data:
  source: https://archive.ics.uci.edu/dataset/2/adult
  target_column: income
  positive_label: ">50K"
  audit_column: sex
  missing_category_marker: __MISSING__
  duplicate_policy: exact_cleaned_15_columns_train_priority

model:
  name: CatBoostClassifier
  task_type: CPU
  iterations: 400
  depth: 6
  learning_rate: 0.08
  early_stopping_rounds: 60

monitoring:
  reference_split: reference
  current_split: current
  decision_threshold: 0.5
  alert_f1_margin: 0.05

scenarios:
  seed: 42
  output_dir: data/processed/scenarios
  feature_drift:
    age_delta: 5
  feature_drift_strong:
    age_delta: 15
  target_drift:
    positive_rate: 0.60
  fairness_shift:
    female_positive_rate: 0.03
    # female_rows defaults to the Female count in current.csv.
  fairness_defect:
    female_probability_multiplier: 0.05

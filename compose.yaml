name: adult-income-monitoring

services:
  init:
    profiles: ["init"]
    build: .
    command: ["python", "-m", "adult_monitoring", "pipeline", "--config", "configs/example.yaml"]
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./reports:/app/reports

  exporter:
    build: .
    command: ["python", "-m", "adult_monitoring.exporter", "--config", "configs/example.yaml", "--host", "0.0.0.0", "--port", "8000", "--refresh-seconds", "60"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 2m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.10.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=7d"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./prometheus/rules.test.yml:/etc/prometheus/rules.test.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      exporter:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus-data:
